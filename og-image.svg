<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e0a3c"/>
      <stop offset="100%" stop-color="#05050a"/>
    </radialGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b2fbe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7b2fbe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e8c96d"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c9a84c" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#e8c96d"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Stars -->
  <circle cx="120" cy="80"  r="1.5" fill="white" opacity="0.5"/>
  <circle cx="340" cy="40"  r="1"   fill="white" opacity="0.4"/>
  <circle cx="600" cy="25"  r="1.5" fill="white" opacity="0.6"/>
  <circle cx="870" cy="60"  r="1"   fill="white" opacity="0.4"/>
  <circle cx="1080" cy="90" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="200" cy="520" r="1"   fill="white" opacity="0.3"/>
  <circle cx="980" cy="500" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="1150" cy="300" r="1"  fill="white" opacity="0.5"/>
  <circle cx="50"  cy="310" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="730" cy="580" r="1"   fill="white" opacity="0.3"/>
  <circle cx="450" cy="560" r="1.5" fill="rgba(200,180,255,1)" opacity="0.4"/>
  <circle cx="760" cy="100" r="1"   fill="rgba(200,180,255,1)" opacity="0.4"/>

  <!-- Orbs -->
  <ellipse cx="200" cy="280" rx="320" ry="300" fill="url(#orb1)"/>
  <ellipse cx="1050" cy="380" rx="240" ry="220" fill="url(#orb2)"/>

  <!-- Border frame -->
  <rect x="40" y="30" width="1120" height="570" rx="16" fill="none" stroke="#c9a84c" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="52" y="42" width="1096" height="546" rx="12" fill="none" stroke="#c9a84c" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Top ornament -->
  <text x="600" y="105" font-family="Georgia, serif" font-size="22" fill="#c9a84c" opacity="0.6" text-anchor="middle" letter-spacing="18">✦  ◆  ✦</text>

  <!-- Eyebrow label -->
  <text x="600" y="158" font-family="Georgia, serif" font-size="14" fill="#c9a84c" opacity="0.75" text-anchor="middle" letter-spacing="6">A DIGITAL GUIDE FOR CONSCIOUS AWAKENING</text>

  <!-- Horizontal rule -->
  <rect x="460" y="170" width="280" height="1" fill="url(#line-grad)" opacity="0.5"/>

  <!-- Main title -->
  <text x="600" y="252" font-family="Georgia, 'Book Antiqua', serif" font-size="68" font-weight="bold" fill="url(#title-grad)" text-anchor="middle" letter-spacing="2">Awakening Guide</text>

  <!-- Subtitle rule -->
  <rect x="500" y="272" width="200" height="1.5" fill="url(#line-grad)"/>

  <!-- Subtitle -->
  <text x="600" y="320" font-family="Georgia, serif" font-size="26" fill="#e8c96d" text-anchor="middle" letter-spacing="4" opacity="0.9">Escape the Mental Programming</text>

  <!-- Description -->
  <text x="600" y="374" font-family="Georgia, serif" font-size="17" fill="#9d91b8" text-anchor="middle" letter-spacing="1">PDF Guide · Inner Work Workbook · 7-Day Challenge</text>

  <!-- Price badge -->
  <rect x="500" y="410" width="200" height="50" rx="25" fill="#c9a84c"/>
  <text x="600" y="441" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#05050a" text-anchor="middle">Get it for $9.99</text>

  <!-- Bottom ornament -->
  <text x="600" y="545" font-family="Georgia, serif" font-size="14" fill="#c9a84c" opacity="0.4" text-anchor="middle" letter-spacing="18">◆  ◆  ◆</text>

  <!-- Domain -->
  <text x="600" y="578" font-family="Georgia, serif" font-size="13" fill="#6b5f8a" text-anchor="middle" letter-spacing="2">awakening-guide.vercel.app</text>
</svg>
